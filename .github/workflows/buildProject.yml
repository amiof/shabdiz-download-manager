name: Build Shabdiz Download Manager (macOS)

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify aria2 exists
        run: |
          if [ ! -f "electron/src/release-aria2/bin/macOS/aria2c" ]; then
            echo "ERROR: aria2c not found"
            exit 1
          fi
          file electron/src/release-aria2/bin/macOS/aria2c

      - name: Install dependencies
        run: npm install

      - name: Build and package
        run: npm run package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shabdiz-macos
          path: release/
