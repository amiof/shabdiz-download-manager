name: Build Shabdiz Download Manager

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'

jobs:
  # ============================================
  # Build aria2 for Windows (x64)
  # ============================================
  build-aria2-windows:
    name: Build aria2 Windows x64
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-cares
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libssh2
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkg-config

      - name: Build aria2
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          
          cd /tmp
          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz" \
            -o aria2.tar.xz
          
          tar -xf aria2.tar.xz
          cd aria2-1.37.0
          
          CPPFLAGS="-DCARES_STATICLIB -DSTATIC_GETOPT" \
          LDFLAGS="-static" \
          PKG_CONFIG="pkg-config --static" \
          ./configure \
            --prefix=/mingw64 \
            ARIA2_STATIC=yes \
            --enable-static \
            --disable-shared \
            --disable-nls \
            --with-libcares-prefix=/mingw64 \
            --with-libgmp-prefix=/mingw64 \
            --with-openssl \
            --with-libssh2 \
            --with-sqlite3 \
            --with-libexpat \
            --with-libz
          
          make -j"$(nproc)" LDFLAGS="-static -all-static"
          
          mkdir -p "$GITHUB_WORKSPACE/bin/win"
          cp src/aria2c.exe "$GITHUB_WORKSPACE/bin/win/aria2c.exe"

      - name: Verify binary
        shell: msys2 {0}
        run: |
          "$GITHUB_WORKSPACE/bin/win/aria2c.exe" --version

      - name: Upload aria2 Windows
        uses: actions/upload-artifact@v4
        with:
          name: aria2-windows-x64
          path: bin/win/aria2c.exe

  # ============================================
  # Build aria2 for macOS (Universal)
  # ============================================
  build-aria2-macos-x64:
    name: Build aria2 macOS x64
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew update
          brew install autoconf automake libtool pkg-config

      - name: Prepare directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deps"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

      - name: Build GMP
        env:
          ARCH: x86_64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail
          cd "$DEPS"
          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz" -o gmp-6.3.0.tar.xz
          tar -xf gmp-6.3.0.tar.xz && cd gmp-6.3.0
          ./configure --prefix="$DEPS/gmp" --disable-shared --enable-static --disable-cxx --build="$ARCH-apple-darwin"
          make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Build c-ares
        env:
          ARCH: x86_64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail
          cd "$DEPS"
          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://github.com/c-ares/c-ares/releases/download/v1.34.5/c-ares-1.34.5.tar.gz" -o c-ares-1.34.5.tar.gz
          tar -xf c-ares-1.34.5.tar.gz && cd c-ares-1.34.5
          ./configure --prefix="$DEPS/c-ares" --disable-shared --enable-static --build="$ARCH-apple-darwin"
          make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Build aria2
        env:
          ARCH: x86_64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/build"
          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz && cd aria2-1.37.0
          export CPPFLAGS="-I$DEPS/gmp/include -I$DEPS/c-ares/include"
          export LDFLAGS="-L$DEPS/gmp/lib -L$DEPS/c-ares/lib"
          ./configure \
            ARIA2_STATIC=yes \
            --prefix="$DEPS/aria2" \
            --disable-shared --enable-static --disable-nls \
            --with-libgmp="$DEPS/gmp" \
            --with-libcares="$DEPS/c-ares" \
            --without-libssh2 --without-gnutls --without-openssl \
            --with-appletls --without-libxml2
          make -j"$(sysctl -n hw.ncpu)" && make install
          cp "$DEPS/aria2/bin/aria2c" "$GITHUB_WORKSPACE/artifacts/aria2c-x86_64"

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-x64
          path: artifacts/aria2c-x86_64

  build-aria2-macos-arm64:
    name: Build aria2 macOS arm64
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew update
          brew install autoconf automake libtool pkg-config

      - name: Prepare directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deps"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

      - name: Build GMP
        env:
          ARCH: arm64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail
          cd "$DEPS"
          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz" -o gmp-6.3.0.tar.xz
          tar -xf gmp-6.3.0.tar.xz && cd gmp-6.3.0
          ./configure --prefix="$DEPS/gmp" --disable-shared --enable-static --disable-cxx --build="$ARCH-apple-darwin"
          make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Build c-ares
        env:
          ARCH: arm64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail
          cd "$DEPS"
          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://github.com/c-ares/c-ares/releases/download/v1.34.5/c-ares-1.34.5.tar.gz" -o c-ares-1.34.5.tar.gz
          tar -xf c-ares-1.34.5.tar.gz && cd c-ares-1.34.5
          ./configure --prefix="$DEPS/c-ares" --disable-shared --enable-static --build="$ARCH-apple-darwin"
          make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Build aria2
        env:
          ARCH: arm64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/build"
          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz && cd aria2-1.37.0
          export CPPFLAGS="-I$DEPS/gmp/include -I$DEPS/c-ares/include"
          export LDFLAGS="-L$DEPS/gmp/lib -L$DEPS/c-ares/lib"
          ./configure \
            ARIA2_STATIC=yes \
            --prefix="$DEPS/aria2" \
            --disable-shared --enable-static --disable-nls \
            --with-libgmp="$DEPS/gmp" \
            --with-libcares="$DEPS/c-ares" \
            --without-libssh2 --without-gnutls --without-openssl \
            --with-appletls --without-libxml2
          make -j"$(sysctl -n hw.ncpu)" && make install
          cp "$DEPS/aria2/bin/aria2c" "$GITHUB_WORKSPACE/artifacts/aria2c-arm64"

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-arm64
          path: artifacts/aria2c-arm64

  build-aria2-macos-universal:
    name: Create macOS Universal aria2
    needs: [build-aria2-macos-x64, build-aria2-macos-arm64]
    runs-on: macos-15

    steps:
      - name: Download x64
        uses: actions/download-artifact@v4
        with:
          name: aria2-macos-x64
          path: bin/x64
      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: aria2-macos-arm64
          path: bin/arm64

      - name: Create Universal binary
        run: |
          set -euxo pipefail
          chmod +x bin/x64/aria2c-x86_64 bin/arm64/aria2c-arm64
          lipo -create bin/x64/aria2c-x86_64 bin/arm64/aria2c-arm64 -output bin/aria2c
          chmod +x bin/aria2c

      - name: Verify
        run: |
          file bin/aria2c
          lipo -info bin/aria2c
          otool -L bin/aria2c | grep -v -E '/usr/lib/|/System/Library/' && exit 1 || true

      - name: Test
        run: |
          arch -arm64 bin/aria2c --version
          arch -x86_64 bin/aria2c --version

      - name: Upload Universal
        uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-universal
          path: bin/aria2c

  # ============================================
  # Build Electron App (per platform)
  # ============================================
  build-electron-mac:
    name: Build Electron macOS
    needs: build-aria2-macos-universal
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download aria2
        uses: actions/download-artifact@v4
        with:
          name: aria2-macos-universal
          path: electron/src/release-aria2/bin/macOS

      - name: Make executable
        run: chmod +x electron/src/release-aria2/bin/macOS/aria2c

      - name: Install dependencies
        run: npm install

      - name: Build and package
        run: npm run package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shabdiz-macos
          path: |
            release/*.dmg
            release/*.zip

  build-electron-windows:
    name: Build Electron Windows
    needs: build-aria2-windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download aria2
        uses: actions/download-artifact@v4
        with:
          name: aria2-windows-x64
          path: electron/src/release-aria2/bin/win

      - name: Install dependencies
        run: npm install

      - name: Build and package
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shabdiz-windows
          path: |
            release/*.exe

  build-electron-linux:
    name: Build Electron Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            libarchive-tools \
            libopenjp2-tools \
            pkg-config

      - name: Install dependencies
        run: npm install

      - name: Build and package
        run: npm run package:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shabdiz-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    name: Create Release
    needs: [build-electron-mac, build-electron-windows, build-electron-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
