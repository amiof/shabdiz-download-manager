name: Build aria2 macOS Universal

on:
  workflow_dispatch:

jobs:
  build-x64:
    name: Build aria2 x64
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew update
          brew install autoconf automake libtool pkg-config

      - name: Prepare directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deps"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/x64"

      - name: Build GMP
        env:
          ARCH: x86_64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail

          cd "$DEPS"

          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz" \
            -o gmp-6.3.0.tar.xz

          tar -xf gmp-6.3.0.tar.xz
          cd gmp-6.3.0

          ./configure \
            --prefix="$DEPS/gmp" \
            --disable-shared \
            --enable-static \
            --disable-cxx \
            --build="$ARCH-apple-darwin"

          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build c-ares
        env:
          ARCH: x86_64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail

          cd "$DEPS"

          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://github.com/c-ares/c-ares/releases/download/v1.34.5/c-ares-1.34.5.tar.gz" \
            -o c-ares-1.34.5.tar.gz

          tar -xf c-ares-1.34.5.tar.gz
          cd c-ares-1.34.5

          ./configure \
            --prefix="$DEPS/c-ares" \
            --disable-shared \
            --enable-static \
            --build="$ARCH-apple-darwin"

          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build aria2
        env:
          ARCH: x86_64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/build"

          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz" \
            -o aria2.tar.xz

          tar -xf aria2.tar.xz
          cd aria2-1.37.0

          export CPPFLAGS="\
          -I$DEPS/gmp/include \
          -I$DEPS/c-ares/include \
          "

          export LDFLAGS="\
          -L$DEPS/gmp/lib \
          -L$DEPS/c-ares/lib \
          "

          ./configure \
            ARIA2_STATIC=yes \
            --prefix="$DEPS/aria2" \
            --disable-shared \
            --enable-static \
            --disable-nls \
            --with-libgmp="$DEPS/gmp" \
            --with-libcares="$DEPS/c-ares" \
            --without-libssh2 \
            --without-gnutls \
            --without-openssl \
            --with-appletls \
            --without-libxml2

          make -j"$(sysctl -n hw.ncpu)"
          make install

          cp "$DEPS/aria2/bin/aria2c" \
            "$GITHUB_WORKSPACE/artifacts/x64/aria2c-x86_64"

          chmod +x \
            "$GITHUB_WORKSPACE/artifacts/x64/aria2c-x86_64"

      - name: Inspect x64 binary
        run: |
          set -euxo pipefail

          file artifacts/x64/aria2c-x86_64
          otool -hv artifacts/x64/aria2c-x86_64
          otool -L artifacts/x64/aria2c-x86_64

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-x64
          path: artifacts/x64/aria2c-x86_64

  build-arm64:
    name: Build aria2 arm64
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew update
          brew install autoconf automake libtool pkg-config

      - name: Prepare directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deps"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/arm64"

      - name: Build GMP
        env:
          ARCH: arm64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail

          cd "$DEPS"

          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz" \
            -o gmp-6.3.0.tar.xz

          tar -xf gmp-6.3.0.tar.xz
          cd gmp-6.3.0

          ./configure \
            --prefix="$DEPS/gmp" \
            --disable-shared \
            --enable-static \
            --disable-cxx \
            --build="$ARCH-apple-darwin"

          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build c-ares
        env:
          ARCH: arm64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail

          cd "$DEPS"

          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://github.com/c-ares/c-ares/releases/download/v1.34.5/c-ares-1.34.5.tar.gz" \
            -o c-ares-1.34.5.tar.gz

          tar -xf c-ares-1.34.5.tar.gz
          cd c-ares-1.34.5

          ./configure \
            --prefix="$DEPS/c-ares" \
            --disable-shared \
            --enable-static \
            --build="$ARCH-apple-darwin"

          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build aria2
        env:
          ARCH: arm64
          DEPS: ${{ github.workspace }}/deps
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/build"

          curl -fL --retry 5 --retry-all-errors --retry-connrefused \
            "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz" \
            -o aria2.tar.xz

          tar -xf aria2.tar.xz
          cd aria2-1.37.0

          export CPPFLAGS="\
          -I$DEPS/gmp/include \
          -I$DEPS/c-ares/include \
          "

          export LDFLAGS="\
          -L$DEPS/gmp/lib \
          -L$DEPS/c-ares/lib \
          "

          ./configure \
            ARIA2_STATIC=yes \
            --prefix="$DEPS/aria2" \
            --disable-shared \
            --enable-static \
            --disable-nls \
            --with-libgmp="$DEPS/gmp" \
            --with-libcares="$DEPS/c-ares" \
            --without-libssh2 \
            --without-gnutls \
            --without-openssl \
            --with-appletls \
            --without-libxml2

          make -j"$(sysctl -n hw.ncpu)"
          make install

          cp "$DEPS/aria2/bin/aria2c" \
            "$GITHUB_WORKSPACE/artifacts/arm64/aria2c-arm64"

          chmod +x \
            "$GITHUB_WORKSPACE/artifacts/arm64/aria2c-arm64"

      - name: Inspect arm64 binary
        run: |
          set -euxo pipefail

          file artifacts/arm64/aria2c-arm64
          otool -hv artifacts/arm64/aria2c-arm64
          otool -L artifacts/arm64/aria2c-arm64

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-arm64
          path: artifacts/arm64/aria2c-arm64

  universal:
    name: Create Universal aria2
    needs:
      - build-x64
      - build-arm64

    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: aria2-macos-x64
          path: artifacts/x64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: aria2-macos-arm64
          path: artifacts/arm64

      - name: Create Universal binary
        run: |
          set -euxo pipefail

          mkdir -p universal

          chmod +x artifacts/x64/aria2c-x86_64
          chmod +x artifacts/arm64/aria2c-arm64

          lipo -create \
            artifacts/x64/aria2c-x86_64 \
            artifacts/arm64/aria2c-arm64 \
            -output universal/aria2c

          chmod +x universal/aria2c

      - name: Verify Universal binary
        run: |
          set -euxo pipefail

          echo "===== FILE ====="
          file universal/aria2c

          echo "===== LIPO INFO ====="
          lipo -info universal/aria2c

          echo "===== ARCHITECTURE ====="
          otool -hv universal/aria2c

          echo "===== DEPENDENCIES ====="
          otool -L universal/aria2c

          echo "===== CHECK HOMEBREW DEPENDENCIES ====="

          if otool -L universal/aria2c | grep -E \
            '/opt/homebrew/|/usr/local/opt/|/opt/local/'; then

            echo "ERROR: aria2c still has a package-manager dependency."
            exit 1
          fi

          echo "No Homebrew/MacPorts dynamic dependencies found."

      - name: Test x64 slice
        run: |
          set -euxo pipefail
          arch -x86_64 universal/aria2c --version

      - name: Test arm64 slice
        run: |
          set -euxo pipefail
          arch -arm64 universal/aria2c --version

      - name: Upload Universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-universal
          path: universal/aria2c
