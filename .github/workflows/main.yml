
name: Build macOS Universal aria2

on:
  workflow_dispatch:

jobs:
  # ============================================================
  # Build aria2 for Intel x86_64
  # ============================================================
  build-x64:
    name: Build aria2 x86_64
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          echo "Runner architecture:"
          uname -m
          arch

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            libtool \
            gettext \
            openssl \
            cppunit \
            libxml2 \
            zlib \
            sqlite3 \
            gmp

          brew link --force --overwrite libtool
          brew link --force --overwrite gettext

      - name: Clone aria2
        run: |
          git clone https://github.com/aria2/aria2.git --depth=1

      - name: Build aria2
        shell: bash
        run: |
          set -e

          cd aria2

          BREW_PREFIX="$(brew --prefix)"

          export CPPFLAGS="-I${BREW_PREFIX}/include"
          export LDFLAGS="-L${BREW_PREFIX}/lib"
          export PKG_CONFIG_PATH="${BREW_PREFIX}/lib/pkgconfig"

          echo "Homebrew prefix:"
          echo "${BREW_PREFIX}"

          echo "GMP:"
          brew --prefix gmp

          glibtoolize --force
          autoreconf -fiv

          ./configure \
            --disable-nls \
            --enable-static \
            --disable-shared

          rm -rf po
          mkdir -p po

          printf 'all:\n\t@echo "Skipping po build."\n' > po/Makefile

          make -j"$(sysctl -n hw.logicalcpu)"

      - name: Check x86_64 binary
        run: |
          set -e

          echo "=== File ==="
          file aria2/src/aria2c

          echo "=== Architecture ==="
          lipo -info aria2/src/aria2c || true

          echo "=== Dynamic dependencies ==="
          otool -L aria2/src/aria2c

      - name: Prepare x86_64 artifact
        run: |
          set -e

          mkdir -p artifact

          cp aria2/src/aria2c artifact/aria2c-x86_64

          chmod +x artifact/aria2c-x86_64

          file artifact/aria2c-x86_64

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-x64
          path: artifact/aria2c-x86_64


  # ============================================================
  # Build aria2 for Apple Silicon ARM64
  # ============================================================
  build-arm64:
    name: Build aria2 arm64
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          echo "Runner architecture:"
          uname -m
          arch

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            libtool \
            gettext \
            openssl \
            cppunit \
            libxml2 \
            zlib \
            sqlite3 \
            gmp

          brew link --force --overwrite libtool
          brew link --force --overwrite gettext

      - name: Clone aria2
        run: |
          git clone https://github.com/aria2/aria2.git --depth=1

      - name: Build aria2
        shell: bash
        run: |
          set -e

          cd aria2

          BREW_PREFIX="$(brew --prefix)"

          export CPPFLAGS="-I${BREW_PREFIX}/include"
          export LDFLAGS="-L${BREW_PREFIX}/lib"
          export PKG_CONFIG_PATH="${BREW_PREFIX}/lib/pkgconfig"

          echo "Homebrew prefix:"
          echo "${BREW_PREFIX}"

          echo "GMP:"
          brew --prefix gmp

          glibtoolize --force
          autoreconf -fiv

          ./configure \
            --disable-nls \
            --enable-static \
            --disable-shared

          rm -rf po
          mkdir -p po

          printf 'all:\n\t@echo "Skipping po build."\n' > po/Makefile

          make -j"$(sysctl -n hw.logicalcpu)"

      - name: Check arm64 binary
        run: |
          set -e

          echo "=== File ==="
          file aria2/src/aria2c

          echo "=== Architecture ==="
          lipo -info aria2/src/aria2c || true

          echo "=== Dynamic dependencies ==="
          otool -L aria2/src/aria2c

      - name: Prepare arm64 artifact
        run: |
          set -e

          mkdir -p artifact

          cp aria2/src/aria2c artifact/aria2c-arm64

          chmod +x artifact/aria2c-arm64

          file artifact/aria2c-arm64

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-arm64
          path: artifact/aria2c-arm64


  # ============================================================
  # Create Universal Binary
  # ============================================================
  build-universal:
    name: Create Universal aria2
    runs-on: macos-15

    needs:
      - build-x64
      - build-arm64

    steps:
      - name: Download x86_64 aria2
        uses: actions/download-artifact@v4
        with:
          name: aria2-macos-x64
          path: artifacts/x64

      - name: Download arm64 aria2
        uses: actions/download-artifact@v4
        with:
          name: aria2-macos-arm64
          path: artifacts/arm64

      - name: Inspect downloaded binaries
        run: |
          set -e

          echo "=== x86_64 ==="
          file artifacts/x64/aria2c-x86_64
          lipo -info artifacts/x64/aria2c-x86_64 || true
          otool -L artifacts/x64/aria2c-x86_64

          echo ""
          echo "=== arm64 ==="
          file artifacts/arm64/aria2c-arm64
          lipo -info artifacts/arm64/aria2c-arm64 || true
          otool -L artifacts/arm64/aria2c-arm64

      - name: Create Universal binary
        run: |
          set -e

          chmod +x artifacts/x64/aria2c-x86_64
          chmod +x artifacts/arm64/aria2c-arm64

          mkdir -p universal

          lipo \
            -create \
            artifacts/x64/aria2c-x86_64 \
            artifacts/arm64/aria2c-arm64 \
            -output universal/aria2c

          chmod +x universal/aria2c

      - name: Verify Universal binary
        run: |
          set -e

          echo "===================================="
          echo "Universal aria2"
          echo "===================================="

          echo ""
          echo "=== File ==="
          file universal/aria2c

          echo ""
          echo "=== Architectures ==="
          lipo -info universal/aria2c

          echo ""
          echo "=== Dynamic dependencies ==="
          otool -L universal/aria2c

      - name: Check for Homebrew dependencies
        shell: bash
        run: |
          set -e

          echo "Checking for Homebrew dependencies..."

          if otool -L universal/aria2c | grep -E '/opt/homebrew/|/usr/local/opt/'; then
            echo ""
            echo "WARNING:"
            echo "aria2 still has Homebrew dynamic dependencies."
            echo "The binary may not run on a clean macOS installation."
            exit 1
          fi

          echo ""
          echo "No Homebrew dynamic dependencies found."

      - name: Extract and inspect x86_64 slice
        run: |
          set -e

          mkdir -p test-x64

          lipo \
            universal/aria2c \
            -thin x86_64 \
            -output test-x64/aria2c

          chmod +x test-x64/aria2c

          echo "=== x86_64 slice ==="
          file test-x64/aria2c

          lipo -info test-x64/aria2c

          echo ""
          echo "=== x86_64 dependencies ==="
          otool -L test-x64/aria2c

      - name: Extract and inspect arm64 slice
        run: |
          set -e

          mkdir -p test-arm64

          lipo \
            universal/aria2c \
            -thin arm64 \
            -output test-arm64/aria2c

          chmod +x test-arm64/aria2c

          echo "=== arm64 slice ==="
          file test-arm64/aria2c

          lipo -info test-arm64/aria2c

          echo ""
          echo "=== arm64 dependencies ==="
          otool -L test-arm64/aria2c

      - name: Prepare final artifact
        run: |
          set -e

          mkdir -p final

          cp universal/aria2c final/aria2c

          chmod +x final/aria2c

          echo "Final aria2:"
          file final/aria2c
          lipo -info final/aria2c

      - name: Upload Universal aria2
        uses: actions/upload-artifact@v4
        with:
          name: aria2-macos-universal
          path: final/aria2c
